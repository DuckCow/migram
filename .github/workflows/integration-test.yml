  name: Integration Tests

  on:
    push:
      branches: [ main, develop ]
    pull_request:
      branches: [ main, develop ]

  jobs:
    integration-test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'corretto'

        - name: Cache Gradle packages
          uses: actions/cache@v4
          with:
            path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
            key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
            restore-keys: |
              ${{ runner.os }}-gradle-

        - name: Grant execute permission for gradlew
          run: chmod +x gradlew
          working-directory: server/backend

        - name: Verify Docker is running
          run: docker ps

        - name: Run Integration Tests
          run: ./gradlew test --tests TranslationRedisFallbackIT --info --stacktrace --no-daemon
          working-directory: server/backend
          timeout-minutes: 5
          continue-on-error: true

        - name: Collect thread dump on timeout/failure
          if: failure()
          run: |
            echo "=== Gradle processes ==="
            ps aux | grep gradle || true
            echo "=== Java processes ==="
            ps aux | grep java || true
            echo "=== JVM thread dumps (if any Java processes running) ==="
            for pid in $(pgrep -f 'gradle|java'); do
              echo "Thread dump for PID $pid:"
              jstack $pid || jcmd $pid Thread.print || kill -3 $pid || true
            done
          working-directory: server/backend

        - name: Publish Test Report
          uses: mikepenz/action-junit-report@v4
          if: always()
          with:
            report_paths: '**/build/test-results/test/TEST-*.xml'
            check_name: Integration Test Report

        - name: Upload Test Results
          uses: actions/upload-artifact@v4
          if: failure()
          with:
            name: test-results
            path: server/backend/build/reports/tests/test/
