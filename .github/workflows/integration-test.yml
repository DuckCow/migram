  name: Integration Tests

  on:
    push:
      branches: [ main, develop ]
    pull_request:
      branches: [ main, develop ]

  jobs:
    integration-test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'corretto'

        - name: Cache Gradle packages
          uses: actions/cache@v4
          with:
            path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
            key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
            restore-keys: |
              ${{ runner.os }}-gradle-

        - name: Grant execute permission for gradlew
          run: chmod +x gradlew
          working-directory: server/backend

        - name: Verify Docker is running
          run: docker ps

        - name: Run Integration Tests (with soft timeout)
          run: |
            timeout 300s ./gradlew test --tests TranslationRedisFallbackIT --info --stacktrace --no-daemon || true
          working-directory: server/backend

        - name: Collect thread dump and process info
          if: always()
          run: |
            echo "=== Gradle processes ==="
            ps aux | grep -E 'gradle|GradleDaemon' || true
            echo ""
            echo "=== Java/Test Worker processes ==="
            ps aux | grep -E 'java.*test|GradleWorker' || true
            echo ""
            echo "=== All JVM thread dumps ==="
            for pid in $(pgrep -f 'java'); do
              echo "======================================"
              echo "Thread dump for Java PID $pid:"
              echo "Process info: $(ps -p $pid -o pid,ppid,comm,args || true)"
              echo "--------------------------------------"
              jstack -l $pid 2>&1 || jcmd $pid Thread.print 2>&1 || kill -3 $pid 2>&1 || echo "Failed to get thread dump for $pid"
              echo ""
            done
            echo ""
            echo "=== Non-daemon thread analysis ==="
            echo "Looking for threads preventing JVM shutdown (Lettuce, Netty, HikariCP, OkHttp)..."
          working-directory: server/backend

        - name: Publish Test Report
          uses: mikepenz/action-junit-report@v4
          if: always()
          with:
            report_paths: '**/build/test-results/test/TEST-*.xml'
            check_name: Integration Test Report

        - name: Upload Test Results
          uses: actions/upload-artifact@v4
          if: failure()
          with:
            name: test-results
            path: server/backend/build/reports/tests/test/
