version: '3'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
      - "443:443"
    env_file:
      - .env
    networks:
      - app-network
    

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5001:5001"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge