server:
  port: 8080

#  ssl:
#    enabled: true
  http:
    port: 80
#    redirect-to-http: true

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity-in-ms: 3600000  # 1 hour
  refresh-token-validity-in-ms: 86400000  # 24 hours

spring:
  profiles:
    active: ${SPRING_PROFILE:dev}  # Default to dev if not specified

  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    database: mysql
    show-sql: true
    generate-ddl: true

  main:
    allow-bean-definition-overriding: true

  h2:
    console:
      enabled: false

  security:
    user:
      name: user
      password: 1234

    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: http://localhost:8080/login/oauth2/code/google 



cloud:
  aws:
    s3:
      bucket: withers
    stack:
      auto: false
    region:
      static: ${S3_REGION}
    credentials:
      access-Key: ${S3_ACCESS_KEY}
      secret-Key: ${S3_SECRET_KEY}


translation:
  langid:
    url: "http://localhost:5001/detect"
  opusmt:
    url: "http://localhost:5001/translate"
  cache:
    ttl: 3600 # 캐시 유효시간 (초)

