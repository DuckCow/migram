# Development Environment Configuration

server:
  forward-headers-strategy: framework  # Trust X-Forwarded-* headers (for ngrok/proxies)

jwt:
  secret: ${JWT_SECRET_KEY:dev-local-secret-key-must-be-at-least-32-bytes-long}

spring:
  jpa:
    hibernate:
      ddl-auto: update  # Let Hibernate manage schema in dev (Flyway disabled for H2)
    show-sql: true  # Show SQL queries in console
    properties:
      hibernate:
        format_sql: true  # Format SQL for readability
    defer-datasource-initialization: false  # Allow data.sql to run after schema creation

  flyway:
    enabled: false  # Disabled in dev - H2 doesn't support PostgreSQL FTS features

  sql:
    init:
      mode: never  # Don't run data.sql to avoid duplicates with file-based DB

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/migram;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:

  h2:
    console:
      enabled: true  # Enable H2 console in dev
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

logging:
  level:
    com.example.backend: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.cache: DEBUG

# File Storage Configuration
storage:
  type: local  # Use local file storage in development
  local:
    upload-dir: ./uploads  # Local directory for file uploads

# Translation Service Configuration
translation:
  base-url: http://localhost:5001  # Flask translation service
  timeout-ms: 30000  # 30 seconds for model loading
