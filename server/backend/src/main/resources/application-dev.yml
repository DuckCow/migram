# Development Environment Configuration

spring:
  jpa:
    hibernate:
      ddl-auto: create  # Development: Auto-create schema on startup
    show-sql: true  # Show SQL queries in console
    properties:
      hibernate:
        format_sql: true  # Format SQL for readability

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:

  h2:
    console:
      enabled: true  # Enable H2 console in dev
      path: /h2-console

logging:
  level:
    com.example.backend: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
