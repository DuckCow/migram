# Production Environment Configuration

spring:
  jpa:
    hibernate:
      ddl-auto: validate  # Production: Only validate schema, never modify
    show-sql: false  # Don't log SQL in production
    properties:
      hibernate:
        format_sql: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}  # jdbc:postgresql://host:5432/dbname
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  h2:
    console:
      enabled: false  # Disable H2 console in production

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

logging:
  level:
    com.example.backend: INFO
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: logs/migram-app.log
    max-size: 10MB
    max-history: 30
